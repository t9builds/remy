<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Remy cooking</title>
  <desc id="desc">A rat chef watches four pots on a stove. Each pot is an agent session: one is bubbling, one has a PR ready with CI passing, one is waiting for input, and one is smoking because CI failed. A speech bubble summarizes them.</desc>
  <defs>
    <pattern id="tiles" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#FFF4E4"/>
      <path d="M60 0H0V60" fill="none" stroke="#F1E2CB" stroke-width="2"/>
    </pattern>
    <linearGradient id="pot" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7C8BA1"/>
      <stop offset="1" stop-color="#55627A"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#EF6F3C"/>
    </linearGradient>
    <g id="burner">
      <ellipse cx="0" cy="0" rx="62" ry="9" fill="#2A2A38"/>
      <path d="M-40 -2c4-14 10-14 12 0M-14 -2c4-18 12-18 14 0M14 -2c4-14 10-14 12 0" fill="url(#flame)" stroke="url(#flame)" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="pot-body">
      <rect x="-82" y="-74" width="16" height="12" rx="5" fill="#46526A"/>
      <rect x="66" y="-74" width="16" height="12" rx="5" fill="#46526A"/>
      <rect x="-68" y="-86" width="136" height="88" rx="16" fill="url(#pot)"/>
      <rect x="-76" y="-94" width="152" height="16" rx="8" fill="#97A6BC"/>
    </g>
    <clipPath id="card"><rect width="1200" height="540" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
  <!-- kitchen -->
  <rect width="1200" height="540" rx="28" fill="url(#tiles)"/>
  <rect y="500" width="1200" height="40" fill="#E6D3B5"/>
  <path d="M0 512h1200" stroke="#D8C29F" stroke-width="2"/>

  <!-- stove -->
  <rect x="432" y="392" width="756" height="118" rx="14" fill="#3B3B4F"/>
  <rect x="432" y="386" width="756" height="16" rx="8" fill="#55556B"/>
  <g fill="#2A2A38">
    <circle cx="545" cy="470" r="11"/><circle cx="730" cy="470" r="11"/><circle cx="915" cy="470" r="11"/><circle cx="1100" cy="470" r="11"/>
  </g>
  <g fill="#8A8AA3">
    <rect x="543" y="461" width="4" height="9" rx="2"/><rect x="728" y="461" width="4" height="9" rx="2"/><rect x="913" y="461" width="4" height="9" rx="2"/><rect x="1098" y="461" width="4" height="9" rx="2"/>
  </g>

  <!-- pot 1: busy, bubbling -->
  <g transform="translate(545 384)">
    <use href="#burner"/>
    <use href="#pot-body"/>
    <ellipse cx="0" cy="-90" rx="64" ry="9" fill="#E9A04B"/>
    <g fill="#F6C27A">
      <circle cx="-24" cy="-104" r="9"/><circle cx="8" cy="-114" r="12"/><circle cx="34" cy="-102" r="7"/><circle cx="-6" cy="-136" r="6"/><circle cx="22" cy="-146" r="4"/>
    </g>
    <text x="0" y="-30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#FFFFFF">api-fix-login</text>
    <text x="0" y="-10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#D7DEEA">busy</text>
  </g>

  <!-- pot 2: done, PR ready -->
  <g transform="translate(730 384)">
    <use href="#burner"/>
    <use href="#pot-body"/>
    <ellipse cx="0" cy="-90" rx="64" ry="9" fill="#7FB77E"/>
    <path d="M-22 -104q-12-16 0-32q12-16 0-32M14 -104q-12-16 0-32q12-16 0-32" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(0 -196)">
      <rect x="-78" y="-22" width="156" height="40" rx="12" fill="#2EB67D"/>
      <text x="0" y="5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">PR #42 · CI ✓</text>
    </g>
    <text x="0" y="-30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#FFFFFF">docs-refresh</text>
    <text x="0" y="-10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#D7DEEA">ready</text>
  </g>

  <!-- pot 3: waiting for input -->
  <g transform="translate(915 384)">
    <use href="#burner"/>
    <use href="#pot-body"/>
    <ellipse cx="0" cy="-90" rx="64" ry="9" fill="#C9B3E6"/>
    <g transform="translate(18 -168)">
      <circle cx="-34" cy="54" r="7" fill="#FFFFFF" stroke="#3B3B4F" stroke-width="3"/>
      <circle cx="-20" cy="34" r="11" fill="#FFFFFF" stroke="#3B3B4F" stroke-width="3"/>
      <ellipse cx="14" cy="-8" rx="46" ry="36" fill="#FFFFFF" stroke="#3B3B4F" stroke-width="3"/>
      <text x="14" y="10" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#F2A900">?</text>
    </g>
    <text x="0" y="-30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#FFFFFF">flaky-tests</text>
    <text x="0" y="-10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#D7DEEA">needs you</text>
  </g>

  <!-- pot 4: CI failed, smoking -->
  <g transform="translate(1100 384)">
    <use href="#burner"/>
    <use href="#pot-body"/>
    <ellipse cx="0" cy="-90" rx="64" ry="9" fill="#5B4636"/>
    <g fill="#6E6E80" fill-opacity=".75">
      <circle cx="-14" cy="-112" r="18"/><circle cx="12" cy="-126" r="22"/><circle cx="-6" cy="-152" r="16"/><circle cx="20" cy="-166" r="12"/>
    </g>
    <g transform="translate(0 -206)">
      <rect x="-56" y="-22" width="112" height="40" rx="12" fill="#E01E5A"/>
      <text x="0" y="5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">CI ✗</text>
    </g>
    <text x="0" y="-30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#FFFFFF">spike-cache</text>
    <text x="0" y="-10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#D7DEEA">failed</text>
  </g>

  <!-- stool -->
  <rect x="168" y="456" width="168" height="16" rx="8" fill="#B5835A"/>
  <path d="M188 472l-10 30M316 472l10 30M210 472v30M294 472v30" stroke="#8E6340" stroke-width="10" stroke-linecap="round"/>

  <!-- chef: tail -->
  <path d="M190 420c-60 10-110-10-112-46c-2-26 26-34 38-16" fill="none" stroke="#C98B8F" stroke-width="9" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="222" cy="452" rx="26" ry="10" fill="#C98B8F"/>
  <ellipse cx="290" cy="452" rx="26" ry="10" fill="#C98B8F"/>
  <!-- body -->
  <ellipse cx="252" cy="372" rx="72" ry="84" fill="#8C7B6B"/>
  <!-- apron -->
  <path d="M206 318h92l20 116q-66 26-132 0z" fill="#FFFFFF" stroke="#E3DCD2" stroke-width="3"/>
  <rect x="234" y="372" width="36" height="26" rx="6" fill="none" stroke="#E3DCD2" stroke-width="3"/>
  <path d="M206 318q46-22 92 0" fill="none" stroke="#E3DCD2" stroke-width="3"/>
  <!-- arm with ladle, reaching toward the first pot -->
  <path d="M308 336q52-10 92-40" fill="none" stroke="#8C7B6B" stroke-width="22" stroke-linecap="round"/>
  <circle cx="402" cy="294" r="13" fill="#C98B8F"/>
  <path d="M398 300l84-12" stroke="#5E6B80" stroke-width="7" stroke-linecap="round"/>
  <path d="M478 288q8 26 30 22q18-4 14-30z" fill="#7C8BA1" stroke="#5E6B80" stroke-width="4"/>
  <!-- other arm, on the hip -->
  <path d="M196 340q-34 22-14 52" fill="none" stroke="#8C7B6B" stroke-width="20" stroke-linecap="round"/>
  <!-- ears -->
  <circle cx="200" cy="208" r="30" fill="#8C7B6B"/><circle cx="200" cy="208" r="17" fill="#E7A7AE"/>
  <circle cx="300" cy="200" r="28" fill="#8C7B6B"/><circle cx="300" cy="200" r="16" fill="#E7A7AE"/>
  <!-- head and snout -->
  <circle cx="250" cy="262" r="58" fill="#9A8977"/>
  <path d="M286 236q60 6 74 30q-8 22-74 30z" fill="#9A8977"/>
  <circle cx="360" cy="264" r="9" fill="#E07A8A"/>
  <circle cx="290" cy="248" r="8" fill="#2A2A38"/><circle cx="293" cy="245" r="2.6" fill="#FFFFFF"/>
  <path d="M302 284q14 8 28 2" fill="none" stroke="#5A4B3F" stroke-width="3" stroke-linecap="round"/>
  <path d="M340 270l44-12M340 276l46 2M338 282l40 14" stroke="#5A4B3F" stroke-width="2" stroke-linecap="round"/>
  <!-- toque -->
  <rect x="210" y="186" width="84" height="30" rx="6" fill="#FFFFFF" stroke="#E3DCD2" stroke-width="3"/>
  <g fill="#FFFFFF" stroke="#E3DCD2" stroke-width="3">
    <circle cx="222" cy="166" r="26"/><circle cx="282" cy="166" r="26"/><circle cx="252" cy="150" r="32"/>
  </g>
  <rect x="213" y="176" width="78" height="22" fill="#FFFFFF"/>

  <!-- speech bubble -->
  <g transform="translate(376 40)">
    <rect width="420" height="108" rx="20" fill="#FFFFFF" stroke="#3B3B4F" stroke-width="3"/>
    <path d="M34 106l-50 78l92-78z" fill="#FFFFFF" stroke="#3B3B4F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M36 104h52" stroke="#FFFFFF" stroke-width="6"/>
    <text x="26" y="44" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2A2A38">4 agents cooking</text>
    <text x="26" y="80" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#4A4A5E">1 PR ready · 1 needs you · 1 CI failed</text>
  </g>
  </g>
</svg>
